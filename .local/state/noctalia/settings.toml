config_version = 8

[bar.default]
background_opacity = 0.23999999463558197
capsule_padding = 3.0
capsule_thickness = 0.68999998830258846
center = [ "workspaces" ]
contact_shadow = true
end = [ "cpu", "ram", "spacer_2", "tray", "notifications", "volume", "network", "clipboard", "session", "privacy" ]
font_family = "JetBrainsMono NF"
font_weight = 300
start = [ "control-center", "clock", "spacer_3", "media" ]

    [bar.default.dead_zone.actions]
    left = "settings-toggle"

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
icon_size = 40
launcher_icon = "navigation-search"
launcher_position = "start"
position = "right"
reserve_space = false
show_dots = true

[hot_corners]
delay_ms = 150

    [hot_corners.top_left]
    action = "window_switcher"

    [hot_corners.top_right]
    action = "control_center"

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.29999999329447746

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000006",
    "lockscreen-widget-0000000000000007"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 80.0
    box_width = 464.0
    cx = 960.0
    cy = 724.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.23000000000000001
        input_radius = 32.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 400.0
    box_width = 560.0
    cx = 960.0
    cy = 476.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background_opacity = 0.0

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 612.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        background_opacity = 0.0
        stat = "ram_pct"
        stat2 = "cpu_usage"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 160.0
    box_width = 464.0
    cx = 960.0
    cy = 940.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background = false
        hide_when_no_media = true
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000007]
    box_height = 80.0
    box_width = 128.0
    cx = 1008.0
    cy = 972.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000007.settings]
        background = false
        bands = 32
        show_when_idle = false

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/init/Downloads/initsyscall.png"
font_family = "JetBrainsMono NF Light"
panel_anchor_bar = "default"
password_style = "random"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    open_near_click_launcher = true
    polkit_placement = "attached"
    polkit_position = "auto"
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Catppuccin"
community_palette = "Mizuki-Akiyama"
mode = "auto"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/init/Pictures/Wallpapers"

    [wallpaper.automation]
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/init/Pictures/Wallpapers/purple_leaves.png"

    [wallpaper.last]
    path = "/home/init/Pictures/Wallpapers/purple_leaves.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/init/Pictures/Wallpapers/purple_leaves.png"

    [[wallpaper.favorite]]
    path = "/home/init/Pictures/Wallpapers/limine.jpeg"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    builtin_palette = "Catppuccin"
    palette_source = "builtin"
    path = "/home/init/Pictures/Wallpapers/purple_leaves.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    path = "/home/init/Pictures/Wallpapers/Nlack.jpg"
    theme_mode = "auto"

[widget.battery]
enabled = true

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.cat_2]
type = "noctalia/bongocat:cat"

[widget.clock]
color = "primary"
font_family = "Adwaita Sans"
scale = 1.05

[widget.control-center]
glyph = "navigation"

[widget.cpu]
display = "text"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.ram]
display = "text"
label_show_units = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.5
focused_output_only = true
hide_when_empty = true